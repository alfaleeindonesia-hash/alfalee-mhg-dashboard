<style>body{margin:0;background:#fff;font-family:'Inter','Helvetica Neue',Arial,sans-serif}svg text{font-family:'Inter','Helvetica Neue',Arial,sans-serif}</style></head><body>

el('rect',{x:580,y:Y+2,width:22,height:14,fill:K.dn});T(610,Y+14,'Harga masuk lebih tinggi dari harga sekarang (pembeli itu rugi)',15);
el('path',{d:`M1110 ${Y+9}l8-8 8 8-8 8z`,fill:'#fff',stroke:K.ink,'stroke-width':2});T(1134,Y+14,'Harga pasar saat transaksi',15);

 wifi:{name:'WIFI',sub:'internet · IPO 2020',col:K.wifi,now:840,rows:[

 inet:{name:'INET',sub:'jaringan internet · IPO 2023',col:K.inet,now:171,rows:[

};

 const x0=600,x1=1560,max={wifi:3200,dooh:400,inet:400}[k];

 const rh=60,h=rh*d.rows.length+64;
 el('rect',{x:50,y:Y,width:1700,height:h,rx:10,fill:'#fff',stroke:K.line});

 d.rows.forEach((r,i)=>{const y=Y+60+i*rh;

 });

 el('rect',{x:50,y:Y,width:8,height:h,rx:4,fill:d.col});
 T(80,Y+34,d.name,26,700,d.col);T(180,Y+34,'harga sekarang '+idr(d.now),15,400,K.mut);
 d.rows.forEach((r,i)=>{const y=Y+56+i*rh,p=pcts[i];
  T(80,y+20,r[0],15,600);T(80,y+38,r[1],12,400,K.mut);

  const tx=p>=0?b+10:a-10;T(tx,y+24,(r[5]?'≈':'')+fmtp(p),15,700,p>=0?K.up:K.dn,p>=0?'start':'end');
 });
 el('line',{x1:zx,x2:zx,y1:Y+46,y2:Y+h-6,stroke:K.ink,'stroke-width':2});
 T(zx,Y+44,'impas (0%)',13,600,K.mut,'middle');
 Y+=h+22;
}
T(50,Y+4,'* Harga PIS Jan dan Mar 2024 dihitung dari titik tengah rentang harga.',13,400,K.mut);
Y+=44;
// ---------- chart 3 DOOH timeline
T(50,Y,'3. DOOH selama MTO: apa yang terjadi di harga pasar?',28,700);

el('rect',{x:50,y:Y,width:1700,height:CH,rx:10,fill:'#fff',stroke:K.line});

T((dx(10,5)+dx(11,3))/2,py0-4,'Masa MTO (5 Okt – 3 Nov)',14,700,'#9A6700','middle');
// ref lines
el('line',{x1:px0,x2:px1,y1:vy(50),y2:vy(50),stroke:K.navy,'stroke-width':2.5,'stroke-dasharray':'8 6'});

const lab={0:['30 Jul','Rp236',-6,26],1:['2 Okt','Rp366',0,-14],2:['5 Okt','Rp352',16,-12],3:['9 Okt','Rp270',0,26],4:['12 Okt','Rp304',24,24],5:['3 Nov','Rp200',0,30],6:['9 Nov','Rp212',20,-14]};
pts.forEach((p,i)=>{const x=dx(p[0],p[1]),y=vy(p[2]);el('circle',{cx:x,cy:y,r:7,fill:K.dooh,stroke:'#fff','stroke-width':2.5});
 const l=lab[i];T(x+l[2],y+l[3],l[1],15,700,K.dooh,'middle');T(x,py1+22,l[0],13,500,K.mut,'middle');
 el('line',{x1:x,x2:x,y1:py1,y2:py1+6,stroke:K.mut});});

 if(i)T(x+18,y+5,'PIS→BBS Rp'+p[2],14,700,K.tx,'start');else T(x,y-20,'PIS→BBS Rp'+p[2],14,700,K.tx,'middle');});

note(450,py0+345,330,['Pengumuman MTO Rp148 (2 Okt)','Pasar Rp366: MTO 60% di bawah pasar.'],K.up);
note(1330,py0+345,400,['Hasil MTO: nol saham ditenderkan','Tak ada yang mau jual di Rp148 saat','pasar Rp200–366.'],K.up);
note(1330,py0+12,400,['Turun 43% selama MTO (352 → 200)','Belum tentu karena MTO. Pola harga','dan rencana RI 1:20 ikut berperan.'],K.dn);

const cards=[
 [K.up,'Harga termurah','SII membeli 51% DOOH di Rp50 padahal pasar Rp236. ISB masuk WIFI di Rp186 (PP 2022).'],
 [K.dooh,'Harga keluar terbaik','ISB menjual ke SGK di Rp2.870 (pasar Rp1.025). PIS menjual ke BBS di Rp330–336 saat MTO. AKUN menjual ke CNI di Rp300 (rencana, pasar sekarang Rp171).'],

 [K.navy,'Yang perlu diwaspadai','Rights issue DOOH 1:20 (potensi dilusi hingga 95,24%) dan harga RI yang belum final. Harga transaksi pengendali bukan target harga.']];
cards.forEach((c,i)=>{const x=50+i*430,w=410;el('rect',{x,y:Y,width:w,height:160,rx:10,fill:K.soft,stroke:K.line});el('rect',{x,y:Y,width:w,height:8,rx:4,fill:c[0]});
 T(x+20,Y+42,c[1],20,700,c[0]);
 const words=c[2].split(' ');let line='',ys=Y+72;for(const wd of words){if((line+' '+wd).length>44){T(x+20,ys,line,15);ys+=22;line=wd}else line=(line?line+' ':'')+wd}T(x+20,ys,line,15);});
